version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: cephilis
    main: ./cmd/cephilis
    binary: cephilis
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/HudoGriz/cephilis/internal/cli.Version={{.Version}}

archives:
  - id: cephilis
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - config/*.yaml
      - systemd/*
      - monitoring/**/*

nfpms:
  - id: cephilis
    package_name: cephilis
    homepage: https://github.com/HudoGriz/cephilis
    maintainer: HudoGriz <blaz.vrhovsek95@gmail.com>
    description: CephFS per-directory usage and D-safe client health exporter for Prometheus.
    license: MIT
    formats: [rpm, deb]
    bindir: /usr/bin
    contents:
      - src: systemd/*
        dst: /usr/lib/systemd/system/
      - src: config/mounts.yaml
        dst: /etc/cephilis/mounts.yaml
        type: config|noreplace
      - src: config/sections.yaml
        dst: /etc/cephilis/sections.yaml
        type: config|noreplace
      - src: monitoring/grafana/dashboards/cephilis.json
        dst: /usr/share/cephilis/grafana/cephilis.json
      - src: monitoring/prometheus/cephilis-rules.yml
        dst: /usr/share/cephilis/prometheus/cephilis-rules.yml

dockers:
  - image_templates:
      - "ghcr.io/hudogriz/cephilis:{{ .Version }}"
      - "ghcr.io/hudogriz/cephilis:latest"
    dockerfile: Dockerfile.release
    goarch: amd64
    build_flag_templates:
      - "--label=org.opencontainers.image.source=https://github.com/HudoGriz/cephilis"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.licenses=MIT"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: HudoGriz
    name: cephilis
  draft: false
  prerelease: auto
