version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: cephilis
    main: ./cmd/cephilis
    binary: cephilis
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/HudoGriz/cephilis/internal/cli.Version={{.Version}}

archives:
  - id: cephilis
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    files:
      - LICENSE
      - README.md
      - config/paths.yaml
      - systemd/

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: HudoGriz
    name: cephilis-go
  draft: false
  prerelease: auto
