# cephilis sections.yaml
# Each section reports its own recursive size and one metric per immediate
# subdirectory, read from CephFS xattrs (ceph.dir.rbytes / rfiles) — no tree
# walk. Nested sections give the Grafana folder tree its drill-down levels.
workers: 16
sections:
  - name: Home
    path: /cephfs/home
  - name: Projects
    path: /cephfs/projects
  - name: Project archive
    path: /cephfs/projects/archive
