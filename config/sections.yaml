# cephilis sections.yaml
# Directory trees to report, read from CephFS xattrs (ceph.dir.rbytes/rfiles/
# rctime, ceph.quota) — never a tree walk. Each path reports itself plus
# `depth` levels of subdirectories; see README.md.
workers: 16
max_dirs: 1000       # per path; keeps the largest directories
max_entries: 10000   # never list a directory with more immediate entries
skip_quotas: false
paths:
  - path: /cephfs/home
    depth: 1
    owner: true
  - path: /cephfs/projects
    depth: 2
