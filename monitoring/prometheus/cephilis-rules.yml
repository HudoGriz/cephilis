groups:
  - name: cephilis
    rules:
      - alert: CephilisClientUnhealthy
        expr: cephilis_health_ok == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CephFS client unhealthy on {{ $labels.hostname }}"
          description: "{{ $labels.mount }}: mount missing, wrong fstype, or MDS session closed/stale/blocklisted. Run `cephilis health --mode json`."

      - alert: CephilisHealthStale
        expr: time() - node_textfile_mtime_seconds{file=~"(.*/)?cephilis_health.prom"} > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "cephilis health metrics stale on {{ $labels.instance }}"
          description: "cephilis-health.service has not written for 5 minutes; the CephFS client is likely hung (processes in D state)."

      - alert: CephilisSpaceStale
        expr: time() - node_textfile_mtime_seconds{file=~"(.*/)?cephilis-space.prom"} > 3 * 3600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "cephilis space scan stale on {{ $labels.instance }}"
          description: "cephilis-space.prom is older than 3 hours. Check `journalctl -u cephilis-space.service`."

      - alert: CephilisSectionScanFailed
        expr: cephilis_section_scan_ok == 0 or cephilis_section_failed_dirs > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "cephilis could not fully scan {{ $labels.parent }}"
          description: "Section {{ $labels.section }} failed or skipped directories. Check `journalctl -u cephilis-space.service`."
